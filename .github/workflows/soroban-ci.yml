name: Soroban CI

on:
  push:
    branches:
      - scf-v2-soroban
  pull_request:
    paths:
      - "soroban/**"
      - ".github/workflows/soroban-ci.yml"

permissions:
  contents: read
  attestations: read

concurrency:
  group: soroban-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soroban:
    name: Soroban
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: soroban

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32v1-none
          rustup default stable

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          stellar --version
          rustup target list --installed | grep '^wasm32v1-none$'

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build contract WASM
        run: stellar contract build --package yolixa-tip-router --locked
